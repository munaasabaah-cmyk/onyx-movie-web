<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>ONYX Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --accent: #e50914;
  --accent2: #ff1e27;
  --gold: #f5c518;
  --green: #22c55e;
  --bg: #000000;
  --surface: rgba(20, 20, 20, 0.95);
  --surface2: rgba(30, 30, 30, 0.9);
  --text: #ffffff;
  --text2: #a0a0a0;
  --border: rgba(255, 255, 255, 0.1);
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
  --radius: 8px;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --font: 'Cairo', system-ui, sans-serif;
}

html, body {
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.player-root {
  position: relative;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

.player-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  display: block;
  z-index: 1;
}

/* LOADING */
.loading-layer {
  position: absolute;
  inset: 0;
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 50;
  opacity: 1;
  transition: opacity 0.6s ease;
}

.loading-layer.hidden {
  opacity: 0;
  pointer-events: none;
}

.onyx-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3rem;
  letter-spacing: 0.15em;
  color: var(--accent);
  margin-bottom: 30px;
  text-shadow: 0 0 30px rgba(229, 9, 20, 0.5);
  animation: logoPulse 2s ease infinite;
}

@keyframes logoPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.7; transform: scale(0.98); }
}

.spinner {
  width: 60px;
  height: 60px;
  position: relative;
  margin-bottom: 24px;
}

.spinner-ring {
  position: absolute;
  inset: 0;
  border: 3px solid transparent;
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
}

.spinner-ring:nth-child(2) {
  animation-delay: -0.4s;
  border-top-color: var(--accent2);
  inset: 8px;
}

.spinner-ring:nth-child(3) {
  animation-delay: -0.8s;
  border-top-color: var(--gold);
  inset: 16px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loading-text {
  font-size: 15px;
  font-weight: 600;
  color: var(--text2);
  text-align: center;
  padding: 0 20px;
}

.loading-text .source-name {
  color: var(--accent);
  font-weight: 700;
}

/* ERROR */
.error-layer {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, #1a0000 0%, #000 70%);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 60;
  padding: 40px 20px;
  text-align: center;
}

.error-layer.active {
  display: flex;
}

.error-icon {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: rgba(229, 9, 20, 0.15);
  border: 2px solid var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  font-weight: 900;
  color: var(--accent);
  margin-bottom: 25px;
}

.error-title {
  font-size: 24px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 12px;
}

.error-desc {
  font-size: 14px;
  color: var(--text2);
  max-width: 440px;
  line-height: 1.7;
  margin-bottom: 30px;
}

.error-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}

.error-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 12px 28px;
  border-radius: var(--radius);
  font-size: 15px;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  transition: all var(--transition);
}

.error-btn:hover {
  background: var(--accent2);
  transform: translateY(-2px);
}

.error-btn.secondary {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
}

.error-btn.secondary:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* TOAST */
.toast-msg {
  position: absolute;
  top: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: rgba(20, 20, 20, 0.95);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 10px 24px;
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  z-index: 200;
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events: none;
  box-shadow: var(--shadow);
  white-space: nowrap;
}

.toast-msg.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.toast-msg.success {
  border-color: var(--green);
  color: var(--green);
}

.toast-msg.error {
  border-color: var(--accent);
  color: var(--accent);
}

.toast-msg.info {
  border-color: var(--gold);
  color: var(--gold);
}
</style>
</head>
<body>

<div class="player-root" id="playerRoot">

  <!-- LOADING -->
  <div class="loading-layer" id="loadingLayer">
    <div class="onyx-logo">ONYX</div>
    <div class="spinner">
      <div class="spinner-ring"></div>
      <div class="spinner-ring"></div>
      <div class="spinner-ring"></div>
    </div>
    <div class="loading-text">
      جاري التحميل من <span class="source-name" id="loadingSourceName">...</span>
    </div>
  </div>

  <!-- ERROR -->
  <div class="error-layer" id="errorLayer">
    <div class="error-icon">!</div>
    <div class="error-title">تعذر تحميل الفيديو</div>
    <div class="error-desc" id="errorDesc">
      هذا المصدر غير متاح حالياً. جرّب مصدراً آخر.
    </div>
    <div class="error-actions">
      <button class="error-btn" onclick="tryNextSource()">→ المصدر التالي</button>
      <button class="error-btn secondary" onclick="reloadCurrent()">↻ إعادة المحاولة</button>
    </div>
  </div>

  <!-- PLAYER IFRAME -->
  <iframe
    class="player-frame"
    id="playerFrame"
    src="about:blank"
    allowfullscreen
    allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
    referrerpolicy="origin"
    sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-presentation"
  ></iframe>

  <!-- TOAST -->
  <div class="toast-msg" id="toastMsg"></div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════
   ONYX PLAYER — v8.0 (مُصحّح)
   ═══════════════════════════════════════════════════════════ */

// SOURCES from Flask
const SOURCES = {{ sources_json|safe }};

// URL Params
const params = new URLSearchParams(window.location.search);
const mediaType = params.get('type') || 'movie';
const mediaId = params.get('id') || '';
const sourceIndex = parseInt(params.get('source') || '0', 10);
const seasonNum = params.get('season') || '1';
const episodeNum = params.get('episode') || '1';

// State
const state = {
  currentSourceIndex: sourceIndex,
  errorCount: 0,
  loadingTimeout: null,
};

// DOM Refs
const $ = (id) => document.getElementById(id);
const playerFrame = $('playerFrame');
const loadingLayer = $('loadingLayer');
const loadingSourceName = $('loadingSourceName');
const errorLayer = $('errorLayer');
const errorDesc = $('errorDesc');
const toastEl = $('toastMsg');

/* ═══════════════════════════════════════════════════════════
   BUILD URL
   ═══════════════════════════════════════════════════════════ */
function buildUrl(source) {
  let url = source[mediaType] || source.movie || source.tv || '';
  
  url = url.replace(/{id}/g, mediaId);
  url = url.replace(/{s}/g, seasonNum);
  url = url.replace(/{e}/g, episodeNum);
  url = url.replace(/{season}/g, seasonNum);
  url = url.replace(/{episode}/g, episodeNum);
  
  return url;
}

/* ═══════════════════════════════════════════════════════════
   LOAD SOURCE
   ═══════════════════════════════════════════════════════════ */
function loadSource(index) {
  if (index < 0 || index >= SOURCES.length) index = 0;
  
  state.currentSourceIndex = index;
  const source = SOURCES[index];
  
  if (!source) {
    showError('لا يوجد مصدر متاح');
    return;
  }
  
  console.log('[ONYX] Loading:', source.name);
  
  // Show loading
  loadingSourceName.textContent = source.name || 'المصدر';
  loadingLayer.classList.remove('hidden');
  errorLayer.classList.remove('active');
  
  // Build URL
  const url = buildUrl(source);
  console.log('[ONYX] URL:', url);
  
  // Set iframe
  try {
    playerFrame.src = url;
  } catch (e) {
    console.error('[ONYX] Error:', e);
    showError('خطأ في تحميل المصدر');
    return;
  }
  
  // Timeout
  clearTimeout(state.loadingTimeout);
  state.loadingTimeout = setTimeout(() => {
    if (!loadingLayer.classList.contains('hidden')) {
      console.warn('[ONYX] Timeout for:', source.name);
      showError('انتهت مدة الانتظار');
    }
  }, 20000);
}

/* ═══════════════════════════════════════════════════════════
   IFRAME LOAD
   ═══════════════════════════════════════════════════════════ */
playerFrame.addEventListener('load', () => {
  if (playerFrame.src === 'about:blank') return;
  console.log('[ONYX] Iframe loaded');
  setTimeout(() => {
    loadingLayer.classList.add('hidden');
    clearTimeout(state.loadingTimeout);
    state.errorCount = 0;
  }, 800);
});

/* ═══════════════════════════════════════════════════════════
   SHOW ERROR
   ═══════════════════════════════════════════════════════════ */
function showError(msg) {
  clearTimeout(state.loadingTimeout);
  loadingLayer.classList.add('hidden');
  errorDesc.textContent = msg || 'هذا المصدر غير متاح حالياً.';
  errorLayer.classList.add('active');
  state.errorCount++;
}

/* ═══════════════════════════════════════════════════════════
   TRY NEXT / RELOAD
   ═══════════════════════════════════════════════════════════ */
function tryNextSource() {
  const next = state.currentSourceIndex + 1;
  if (next >= SOURCES.length) {
    showError('لا توجد مصادر أخرى متاحة');
    return;
  }
  loadSource(next);
}

function reloadCurrent() {
  state.errorCount = 0;
  errorLayer.classList.remove('active');
  loadSource(state.currentSourceIndex);
}

/* ═══════════════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════════════ */
function showToast(msg, type = '') {
  toastEl.textContent = msg;
  toastEl.className = 'toast-msg show ' + type;
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => {
    toastEl.className = 'toast-msg ' + type;
  }, 2200);
}

/* ═══════════════════════════════════════════════════════════
   NOTIFY PARENT
   ═══════════════════════════════════════════════════════════ */
function notifyParent(event, data) {
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: 'onyx-player',
        event: event,
        data: data,
      }, '*');
    }
  } catch (e) {}
}

/* ═══════════════════════════════════════════════════════════
   MESSAGE FROM PARENT
   ═══════════════════════════════════════════════════════════ */
window.addEventListener('message', (e) => {
  const msg = e.data;
  if (!msg || msg.type !== 'onyx-command') return;
  
  switch (msg.command) {
    case 'loadSource':
      if (msg.idx !== undefined) loadSource(msg.idx);
      break;
    case 'next':
      tryNextSource();
      break;
    case 'reload':
      reloadCurrent();
      break;
  }
});

/* ═══════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  console.log('[ONYX Player] Init');
  console.log('[ONYX] Sources:', SOURCES.length);
  console.log('[ONYX] Media:', mediaType, mediaId);
  
  if (!mediaId) {
    showError('لم يتم تحديد الفيلم');
    return;
  }
  
  if (!SOURCES || !SOURCES.length) {
    showError('لا توجد مصادر متاحة');
    return;
  }
  
  loadSource(sourceIndex);
  notifyParent('ready', { sources: SOURCES.length });
});

/* ═══════════════════════════════════════════════════════════
   KEYBOARD
   ═══════════════════════════════════════════════════════════ */
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && (e.key === 'n' || e.key === 'N')) {
    e.preventDefault();
    tryNextSource();
  }
  if (e.ctrlKey && (e.key === 'r' || e.key === 'R')) {
    e.preventDefault();
    reloadCurrent();
  }
  if (e.key === 'Escape') {
    notifyParent('close', {});
    try { window.parent.postMessage({ type: 'onyx-close' }, '*'); } catch (e) {}
  }
});

// Prevent right-click
document.addEventListener('contextmenu', (e) => e.preventDefault());

console.log('[ONYX Player] Ready');
</script>

</body>
</html>
